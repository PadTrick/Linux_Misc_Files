echo ""
echo "==================================="
echo "|  loading configs of Pad.Trick   |"
echo "==================================="
echo ""

// --- Movement & Basic Actions ---
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SPACE" "+jump"
bind "r" "+reload"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"

// --- Weapon & Utility Binds ---
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4" // Grenades cycle
bind "5" "slot5" // C4 / Explosives
bind "6" "slot6" // HE Grenade
bind "7" "slot7" // Flashbang
bind "8" "slot8" // Smoke
bind "9" "slot9" // Decoy
bind "0" "slot10" // Molotov
bind "f" "slot6" // HE Grenade (Direct key)
bind "g" "slot7" // Flashbang (Direct key)
bind "[" "slot11" // Zeus
bind "," "slot12" // Healthshot
bind "." "slot13" // Utility

bind "F12" "toggleconsole"
bind "e" "+use"
bind "k" "+spray_menu"
bind "x" "drop"
bind "i" "+lookatweapon"
bind "z" "player_ping"
bind "q" "lastinv"
bind "END" "teammenu"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "o" "+cl_show_team_equipment"

// --- Buy Binds ---
bind "b" "buymenu"
bind "KP_7" "buy deagle"
bind "KP_4" "buy m4a1_silencer; buy ak47"
bind "KP_5" "buy ssg08"
bind "KP_1" "buy awp"

// --- Communication ---
bind "v" "+voicerecord"
bind "KP_MINUS" "messagemode"
bind "KP_PLUS" "messagemode2"
bind "F5" "radio1"
bind "F6" "radio2"
bind "F7" "radio3"

// --- Crosshair (Restored from old autoexec) ---
crosshair 1
cl_crosshair_drawoutline 0
cl_crosshair_dynamic_maxdist_splitratio "0.35"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.5"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_friendly_warning "1"
cl_crosshair_recoil 0
cl_crosshair_sniper_width "1"
cl_crosshair_t 0
cl_crosshairalpha "255"
cl_crosshaircolor "4"          // Cyan / Light Blue
cl_crosshairdot 0
cl_crosshairgap "-4"           // Restored old gap (-4)
cl_crosshairsize "1"
cl_crosshairstyle "4"
cl_crosshairthickness "0"
cl_crosshairusealpha 1
cl_fixedcrosshairgap "-2"

// --- Viewmodel & Handedness ---
cl_prefer_lefthanded 1        // Default: Left-handed
bind "c" "switchhands"      // Toggle between left & right hand via Alt key
fov_desired "75.000000"
viewmodel_fov "68"
viewmodel_offset_x "-2"
viewmodel_offset_y "-2"
viewmodel_offset_z "-2"
viewmodel_presetpos "0"

// --- Audio / Music (Music completely muted, only 10s warning enabled) ---
volume "1.0"
snd_gamevolume "1.0"
snd_gamevoicevolume "1.0"
snd_voipvolume "1.0"
snd_autodetect_latency 1
snd_mute_losefocus 1

// Music volume settings completely muted
snd_menumusic_volume "0.0"
snd_roundstart_volume "0.0"
snd_roundend_volume "0.0"
snd_mapobjective_volume "0.0"
snd_mvp_volume "0.0"
snd_deathcamera_volume "0.0"
snd_mute_mvp_music_live_players 1

// 10-second bomb/round warning enabled at low volume
snd_tensecondwarning_volume "0.05"

// --- Mouse & Sensitivity ---
sensitivity "1.000000"
sensitivity_y_scale "1.0"
zoom_sensitivity_ratio "1.0"
m_pitch "0.022"
m_yaw "0.022"

// --- Radar ---
cl_hud_radar_scale "0.94"
cl_radar_scale "0.25"
cl_radar_always_centered 1
cl_radar_icon_scale_min "0.6"
cl_radar_rotate 1
cl_radar_square_with_scoreboard 1

// --- Network & FPS ---
fps_max "120"
fps_max_ui "60"
rate "786432"
cl_net_buffer_ticks "2"

// --- HUD & Telemetry ---
cl_allow_animated_avatars 1
cl_autohelp 0
cl_color "4"
cl_hud_color "5"
cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_net_misdelivery_show "1"
cl_hud_telemetry_ping_show "1"
cl_silencer_mode "0"
cl_sniper_auto_rezoom 1
cl_use_opens_buy_menu 1
con_enable 1
hud_showtargetid 1
mm_dedicated_search_maxping "40"

// --- Visuals & Display ---
r_fullscreen_gamma "2.146298"
r_show_build_info 0
r_drawtracers 1
r_drawtracers_firstperson 0

// --- Write settings ---
host_writeconfig
